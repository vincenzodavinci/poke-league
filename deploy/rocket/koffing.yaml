# Team Rocket · Koffing — a "debug" pod that never got cleaned up.
# Privileged, in the host's PID namespace, with the node's root filesystem
# mounted at /host. From here, `chroot /host` is a node takeover.
# Lab: docs/team-rocket.md#koffing
apiVersion: apps/v1
kind: Deployment
metadata:
  name: koffing
  namespace: team-rocket
  labels: {app.kubernetes.io/name: koffing}
spec:
  replicas: 1
  selector:
    matchLabels: {app.kubernetes.io/name: koffing}
  template:
    metadata:
      labels: {app.kubernetes.io/name: koffing}
      annotations:
        poke-league.dev/pokemon: "109"
    spec:
      hostPID: true
      containers:
        - name: debug
          image: busybox:latest
          command: ["sleep", "infinity"]
          securityContext:
            privileged: true
          volumeMounts:
            - {name: host, mountPath: /host}
      volumes:
        - name: host
          hostPath: {path: /}

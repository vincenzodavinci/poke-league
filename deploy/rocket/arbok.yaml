# Team Rocket · Arbok — the poisoned image.
# A flawless manifest: hardened, limited, probed, own ServiceAccount. But its
# image was pushed to the league registry by someone without the signing key
# (`make rocket` rebuilds dex-api with an extra layer as :arbok-poisoned and never signs it).
# `make rocket` also pins it by digest, like every league image, into
# .build/rocket/arbok.yaml. Seven gyms wave it through. Only Koga notices.
# Lab: docs/team-rocket.md#arbok
apiVersion: v1
kind: ServiceAccount
metadata:
  name: arbok
  namespace: team-rocket
automountServiceAccountToken: false
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: arbok
  namespace: team-rocket
  labels: {app.kubernetes.io/name: arbok}
spec:
  replicas: 1
  selector:
    matchLabels: {app.kubernetes.io/name: arbok}
  template:
    metadata:
      labels: {app.kubernetes.io/name: arbok}
      annotations:
        poke-league.dev/pokemon: "24"
    spec:
      serviceAccountName: arbok
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        seccompProfile: {type: RuntimeDefault}
      containers:
        - name: app
          image: kind-registry:5000/poke-league/dex-api:arbok-poisoned
          ports: [{name: http, containerPort: 8080}]
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: ["ALL"]}
          resources:
            requests: {cpu: 10m, memory: 32Mi}
            limits: {memory: 96Mi}
          livenessProbe: {httpGet: {path: /healthz, port: http}}
          readinessProbe: {httpGet: {path: /readyz, port: http}}

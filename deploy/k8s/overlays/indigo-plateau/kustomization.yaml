# Prod. Every gym is enforced: a workload that fails one never gets admitted.
# The board is exposed on http://localhost:8088 (kind NodePort 30080).
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: indigo-plateau
resources:
  - ../../base
patches:
  - target: {kind: Service, name: league-board}
    patch: |-
      - op: add
        path: /spec/type
        value: NodePort
      - op: add
        path: /spec/ports/0/nodePort
        value: 30080
  - target: {kind: Deployment}
    patch: |-
      - op: replace
        path: /spec/replicas
        value: 2

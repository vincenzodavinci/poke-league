# Gym 7 · Blaine · Volcano Badge (Fire)
# Don't burn the host: privileged containers, host namespaces and hostPath
# mounts are the classic container-escape routes.
apiVersion: policies.kyverno.io/v1
kind: ValidatingPolicy
metadata:
  name: blaine-no-host-access
  annotations:
    poke-league.dev/gym: "7"
    policies.kyverno.io/title: "Blaine - no host access"
spec:
  validationActions: [Audit]          # overlays set Audit+Warn (dev) or Deny (prod)
  evaluation:
    background: {enabled: true}       # re-check running pods, not just new ones
  autogen:
    podControllers: {controllers: [deployments]}   # reject a bad Deployment up front
  matchConstraints:
    resourceRules:
      - apiGroups: [""]
        apiVersions: [v1]
        operations: [CREATE, UPDATE]
        resources: [pods]
    namespaceSelector:
      matchLabels: {poke-league.dev/league: "true"}
  variables:
    - name: containers               # ephemeral too: `kubectl debug` must play by the same rules
      expression: >-
        object.spec.containers + object.spec.?initContainers.orValue([]) +
        object.spec.?ephemeralContainers.orValue([])
  validations:
    - expression: >-
        !object.spec.?hostNetwork.orValue(false) &&
        !object.spec.?hostPID.orValue(false) &&
        !object.spec.?hostIPC.orValue(false)
      message: "Blaine: hostNetwork, hostPID and hostIPC must stay off."
    - expression: "!object.spec.?volumes.orValue([]).exists(v, has(v.hostPath))"
      message: "Blaine: hostPath volumes expose the node's filesystem."
    - expression: "!variables.containers.exists(c, c.?securityContext.?privileged.orValue(false))"
      message: "Blaine: privileged containers own the node."

# Gym 2 · Misty · Cascade Badge (Water)
# No leaks: an env var that looks like a credential must come from a Secret
# (valueFrom.secretKeyRef), never a literal value committed to Git.
apiVersion: policies.kyverno.io/v1
kind: ValidatingPolicy
metadata:
  name: misty-no-plaintext-secrets
  annotations:
    poke-league.dev/gym: "2"
    policies.kyverno.io/title: "Misty - no plaintext secrets"
spec:
  validationActions: [Audit]          # overlays set Audit+Warn (dev) or Deny (prod)
  evaluation:
    background: {enabled: true}       # re-check running pods, not just new ones
  autogen:
    podControllers: {controllers: [deployments]}   # reject a bad Deployment up front
  matchConstraints:
    resourceRules:
      - apiGroups: [""]
        apiVersions: [v1]
        operations: [CREATE, UPDATE]
        resources: [pods]
    namespaceSelector:
      matchLabels: {poke-league.dev/league: "true"}
  variables:
    - name: containers
      expression: object.spec.containers + object.spec.?initContainers.orValue([])
    - name: leaky
      expression: >-
        variables.containers.filter(c, c.?env.orValue([]).exists(e,
          e.name.matches('(?i)(PASSWORD|SECRET|TOKEN|API_?KEY|PRIVATE_?KEY)') && has(e.value)
        )).map(c, c.name)
  validations:
    - expression: size(variables.leaky) == 0
      messageExpression: >-
        'Misty: container(s) ' + variables.leaky.join(', ') + ' put a secret-looking env var in plain text;
        use valueFrom.secretKeyRef.'

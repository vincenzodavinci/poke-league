# Gym 4 · Erika · Rainbow Badge (Grass)
# Know your roots: images come only from the league registry and are pinned to
# a version or digest. :latest (or no tag at all) is a moving target.
apiVersion: policies.kyverno.io/v1
kind: ValidatingPolicy
metadata:
  name: erika-trusted-images
  annotations:
    poke-league.dev/gym: "4"
    policies.kyverno.io/title: "Erika - trusted, pinned images"
spec:
  validationActions: [Audit]          # overlays set Audit+Warn (dev) or Deny (prod)
  evaluation:
    background: {enabled: true}       # re-check running pods, not just new ones
  autogen:
    podControllers: {controllers: [deployments]}   # reject a bad Deployment up front
  matchConstraints:
    resourceRules:
      - apiGroups: [""]
        apiVersions: [v1]
        operations: [CREATE, UPDATE]
        resources: [pods]
    namespaceSelector:
      matchLabels: {poke-league.dev/league: "true"}
  variables:
    - name: containers
      expression: object.spec.containers + object.spec.?initContainers.orValue([])
    - name: untrusted
      expression: >-
        variables.containers.filter(c, !(
          c.image.startsWith('kind-registry:5000/poke-league/') &&
          (c.image.contains('@sha256:') || c.image.substring(c.image.lastIndexOf('/')).contains(':')) &&
          !c.image.endsWith(':latest')
        )).map(c, c.image)
  validations:
    - expression: size(variables.untrusted) == 0
      messageExpression: >-
        'Erika: ' + variables.untrusted.join(', ') + ' must come from kind-registry:5000/poke-league/
        pinned to a version or digest (never :latest).'

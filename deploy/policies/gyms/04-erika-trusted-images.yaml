# Gym 4 · Erika · Rainbow Badge (Grass)
# Know your roots: images come only from the league registry and are pinned by
# digest. Every tag is a moving target, not just :latest: anyone who can push
# to the registry can re-point v1.2.0 or dev. A digest names the bytes.
apiVersion: policies.kyverno.io/v1
kind: ValidatingPolicy
metadata:
  name: erika-trusted-images
  annotations:
    poke-league.dev/gym: "4"
    policies.kyverno.io/title: "Erika - trusted, pinned images"
spec:
  validationActions: [Audit]          # overlays set Audit+Warn (dev) or Deny (prod)
  evaluation:
    background: {enabled: true}       # re-check running pods, not just new ones
  autogen:
    podControllers: {controllers: [deployments]}   # reject a bad Deployment up front
  matchConstraints:
    resourceRules:
      - apiGroups: [""]
        apiVersions: [v1]
        operations: [CREATE, UPDATE]
        resources: [pods]
    namespaceSelector:
      matchLabels: {poke-league.dev/league: "true"}
  variables:
    # Every kind of container a pod can run, including `kubectl debug`'s ephemeral ones.
    - name: containers
      expression: >-
        object.spec.containers + object.spec.?initContainers.orValue([]) +
        object.spec.?ephemeralContainers.orValue([])
    - name: registry
      expression: "'kind-registry:5000/poke-league/'"
    - name: untrusted
      expression: >-
        variables.containers.filter(c, !(
          c.image.startsWith(variables.registry) &&
          c.image.substring(size(variables.registry)).matches('^[a-z0-9][a-z0-9._/-]*(:[A-Za-z0-9._-]+)?@sha256:[a-f0-9]{64}$')
        )).map(c, c.image)
  validations:
    - expression: size(variables.untrusted) == 0
      messageExpression: >-
        'Erika: ' + variables.untrusted.join(', ') + ' must come from ' + variables.registry +
        ' pinned by digest (@sha256:...). Tags can be re-pointed; digests can\'t.'

# Gym 6 · Sabrina · Marsh Badge (Psychic)
# Foresight: probes let Kubernetes restart a wedged container and keep traffic
# away from one that isn't ready, before users notice.
apiVersion: policies.kyverno.io/v1
kind: ValidatingPolicy
metadata:
  name: sabrina-health-probes
  annotations:
    poke-league.dev/gym: "6"
    policies.kyverno.io/title: "Sabrina - liveness and readiness probes"
spec:
  validationActions: [Audit]          # overlays set Audit+Warn (dev) or Deny (prod)
  evaluation:
    background: {enabled: true}       # re-check running pods, not just new ones
  autogen:
    podControllers: {controllers: [deployments]}   # reject a bad Deployment up front
  matchConstraints:
    resourceRules:
      - apiGroups: [""]
        apiVersions: [v1]
        operations: [CREATE, UPDATE]
        resources: [pods]
    namespaceSelector:
      matchLabels: {poke-league.dev/league: "true"}
  variables:
    - name: containers
      expression: object.spec.containers + object.spec.?initContainers.orValue([])
    - name: blind
      expression: >-
        object.spec.containers.filter(c, !has(c.livenessProbe) || !has(c.readinessProbe)).map(c, c.name)
  validations:
    - expression: size(variables.blind) == 0
      messageExpression: "'Sabrina: container(s) ' + variables.blind.join(', ') + ' need a livenessProbe and a readinessProbe.'"

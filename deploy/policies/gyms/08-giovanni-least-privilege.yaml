# Gym 8 · Giovanni · Earth Badge (Ground)
# Ground rules for identity: every workload gets its own ServiceAccount, and the
# API token is mounted only when the pod declares it needs one. A stolen token
# is worth exactly what its RBAC allows (see Team Rocket's Meowth).
apiVersion: policies.kyverno.io/v1
kind: ValidatingPolicy
metadata:
  name: giovanni-least-privilege
  annotations:
    poke-league.dev/gym: "8"
    policies.kyverno.io/title: "Giovanni - least-privilege identity"
spec:
  validationActions: [Audit]          # overlays set Audit+Warn (dev) or Deny (prod)
  evaluation:
    background: {enabled: true}       # re-check running pods, not just new ones
  autogen:
    podControllers: {controllers: [deployments]}   # reject a bad Deployment up front
  matchConstraints:
    resourceRules:
      - apiGroups: [""]
        apiVersions: [v1]
        operations: [CREATE, UPDATE]
        resources: [pods]
    namespaceSelector:
      matchLabels: {poke-league.dev/league: "true"}
  variables:
    - name: containers
      expression: object.spec.containers + object.spec.?initContainers.orValue([])
  validations:
    - expression: object.spec.?serviceAccountName.orValue('default') != 'default'
      message: "Giovanni: don't run as the namespace's default ServiceAccount."
    - expression: >-
        object.spec.?automountServiceAccountToken.orValue(true) == false ||
        object.metadata.?annotations[?'poke-league.dev/needs-api-token'].orValue('') == 'true'
      message: >-
        Giovanni: set automountServiceAccountToken=false, or annotate the pod
        poke-league.dev/needs-api-token="true" if it really calls the Kubernetes API.
